name: Scheduled Publish

# Weekly rebuild so future-dated content (dated blog posts) goes live even on
# a week with no other push. Hugo excludes future-dated content by default,
# so a post sitting on main with a future `date` won't appear until some
# build runs on or after that date — this is that build. Netlify also
# deploys on every push to main directly, so this job only matters when a
# post's date crosses into the past with no push happening that day.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set. Create a build hook in Netlify (Site settings -> Build & deploy -> Build hooks) and add it as a repo secret."
            exit 1
          fi
          curl -sf -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
